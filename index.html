<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKILLd20 Foundations</title>
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/foundations.css">
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">

    <header id="topbar">
      <div id="topbar-left">
        <span id="app-title">SKILLd20</span>
        <span id="app-subtitle">Foundations of Magic</span>
      </div>
      <div id="topbar-right">
        <span id="status-text"></span>
        <button id="btn-traits"        class="btn btn-secondary" style="display:none">Manage Traits</button>
        <button id="btn-cancel-traits" class="btn btn-secondary" style="display:none">Close</button>
        <button id="btn-save-traits"   class="btn btn-primary"   style="display:none">Save Traits</button>
        <button id="btn-token"   class="btn btn-icon"      title="GitHub Token">⚙</button>
      </div>
    </header>

    <nav id="nav-rail">
      <a href="index.html"      class="nav-rail-item"><span class="nav-rail-sym">◆</span><span class="nav-rail-label">Foundations</span></a>
      <a href="feats.html"      class="nav-rail-item"><span class="nav-rail-sym">★</span><span class="nav-rail-label">Feats</span></a>
      <a href="skills.html"     class="nav-rail-item"><span class="nav-rail-sym">◎</span><span class="nav-rail-label">Skills</span></a>
      <a href="materials.html" class="nav-rail-item"><span class="nav-rail-sym">❖</span><span class="nav-rail-label">Materials</span></a>
      <a href="rituals.html"    class="nav-rail-item"><span class="nav-rail-sym">⊕</span><span class="nav-rail-label">Rituals</span></a>
      <a href="crafting.html"   class="nav-rail-item"><span class="nav-rail-sym">⚒</span><span class="nav-rail-label">Crafting</span></a>
      <a href="rules.html"      class="nav-rail-item"><span class="nav-rail-sym">≡</span><span class="nav-rail-label">Rules</span></a>
    </nav>

    <div id="main">
      <aside id="sidebar">
        <div id="sidebar-actions">
          <button id="btn-new"  class="btn btn-primary" style="display:none">+ New</button>
          <button id="btn-edit" class="btn btn-primary" style="display:none">Edit</button>
        </div>
        <div id="search-wrap">
          <input id="search" type="text" placeholder="Search foundations…" autocomplete="off">
        </div>
        <div id="item-list"></div>
      </aside>
      <div id="sidebar-handle" title="Drag to resize"></div>

      <main id="content">
        <div id="empty-state"><p>Select a foundation or create a new one.</p></div>
        <div id="viewer"  class="panel" style="display:none"></div>
        <div id="editor"  class="panel" style="display:none"></div>
        <div id="traits"  class="panel" style="display:none"></div>
      </main>
    </div>

  </div>

  <!-- Token Modal -->
  <div id="modal-overlay" style="display:none">
    <div id="modal">
      <h3>GitHub Token</h3>
      <p>Personal Access Token with <strong>repo</strong> scope. Stored only in your browser's localStorage — never committed to GitHub.</p>
      <input id="token-input" type="password" placeholder="ghp_…" autocomplete="off">
      <div id="modal-buttons">
        <button id="btn-token-save"   class="btn btn-save-action">Save Token</button>
        <button id="btn-token-cancel" class="btn btn-cancel-action">Cancel</button>
        <button id="btn-token-clear"  class="btn btn-delete-action">Clear Token</button>
      </div>
    </div>
  </div>

  <script src="scripts/shared.js" defer></script>
  <script src="scripts/foundations.js" defer></script>
</body>
</html>
