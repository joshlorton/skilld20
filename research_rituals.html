<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rituals — Research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="research.css">
</head>
<body>
<div id="app">

  <div id="topbar">
    <div id="topbar-left">
      <span id="app-title">Loading…</span>
      <span id="app-subtitle"></span>
    </div>
    <div id="topbar-right"></div>
  </div>

  <div id="main">
    <aside id="sidebar">
      <div id="search-wrap">
        <input id="search" type="text" placeholder="Search rituals…" autocomplete="off">
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-title">View</div>
        <div class="view-toggle-row">
          <button id="view-cards-btn" class="view-toggle-btn active">Cards</button>
          <button id="view-table-btn" class="view-toggle-btn">Table</button>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-title">Category</div>
        <div id="group-filters" class="filter-chip-row"></div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-title">Type</div>
        <div id="tag-filters" class="filter-chip-row"></div>
      </div>

      <div id="clear-selection-row" class="clear-selection-row" style="display:none;">
        <button id="btn-clear" class="btn-clear">&larr; Clear selection</button>
      </div>

      <div id="item-list"></div>
    </aside>

    <main id="content-outer">
      <div id="result-count"></div>
      <div id="content"></div>
    </main>
  </div>

</div>

<script src="research.js"></script>
<script>
  initResearchPage({
    dataUrl: "data/research_rituals.json",
    appTitle: "Rituals",
    appSubtitle: "Folk & Alchemical Research",
    groupLabel: "Category",
    cardFields: [
      { key: "origin", label: "Origin" },
    ],
    extraColumns: [
      { key: "tag", label: "Type", sortable: true },
      { key: "origin", label: "Origin", sortable: true },
      { key: "summary", label: "Summary", sortable: false },
      { key: "detail", label: "Detail", sortable: false },
      { key: "notes", label: "Notes", sortable: false },
    ],
    detailFields: [
      { key: "category", label: "Category" },
      { key: "origin", label: "Origin" },
    ],
    detailBlocks: [
      { key: "summary", label: "Summary" },
      { key: "detail", label: "Detail" },
      { key: "notes", label: "Notes", italic: true },
    ],
  });
</script>
</body>
</html>
